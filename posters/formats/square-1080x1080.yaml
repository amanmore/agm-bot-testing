format: Square 1080x1080

canvas:
  width: 1080
  height: 1080
  image_offset_x: 0
  image_offset_y: 0

defaults:
  colour: "#FFFFFF"
  min_size: 40
  line_spacing: 8
  align: center
  valign: middle

layouts:

  Teaser:

    elements:
      - title
      - type
      - datetime
      - dm
      - teaser
      - credits

    definitions:

      title:
        value: "{title}"
        font: fonts/Blue_Cashews.otf
        size: 180
        x: 60
        y: 40
        width: 960
        height: 200

      type:
        value: "A {game_type} {system} {session_type}"
        font: fonts/Gilroy-Bold.ttf
        size: 100
        x: 60
        y: 260
        width: 960
        height: 100
        valign: top

      datetime:
        value: "{poster_datetime}"
        font: fonts/Gilroy-Bold.ttf
        size: 75
        x: 60
        y: 720
        width: 960
        height: 60
        valign: bottom

      dm:
        value: "DM: {dm}"
        font: fonts/Gilroy-Bold.ttf
        size: 75
        colour: "#0DBCDA"
        x: 60
        y: 790
        width: 960
        height: 60

      teaser:
        value: "{teaser}"
        font: fonts/Gilroy-Regular.ttf
        size: 50
        min_size: 18
        x: 100
        y: 860
        width: 880
        height: 140

      credits:
        value: "Art: {art_credits}"
        font: fonts/Gilroy-Bold.ttf
        size: 30
        min_size: 12
        colour: "#BBBBBB"
        align: right
        valign: bottom
        x: 30
        y: 1000
        width: 1020
        height: 70

  Standard:

    elements:
      - title
      - type
      - datetime
      - dm
      - credits

    definitions:

      title:
        value: "{title}"
        font: fonts/Blue_Cashews.otf
        size: 320
        x: 60
        y: 40
        width: 960
        height: 320

      type:
        value: "A {game_type} {system} {session_type}"
        font: fonts/Gilroy-Bold.ttf
        size: 100
        x: 60
        y: 740
        width: 960
        height: 80
        valign: bottom

      datetime:
        value: "{poster_datetime}"
        font: fonts/Gilroy-Bold.ttf
        size: 80
        x: 60
        y: 820
        width: 960
        height: 80
        valign: top

      dm:
        value: "DM: {dm}"
        font: fonts/Gilroy-Bold.ttf
        size: 110
        colour: "#0DBCDA"
        x: 60
        y: 910
        width: 960
        height: 60

      credits:
        value: "Art: {art_credits}"
        font: fonts/Gilroy-Bold.ttf
        size: 30
        min_size: 12
        colour: "#BBBBBB"
        align: right
        valign: bottom
        x: 30
        y: 1000
        width: 1020
        height: 70