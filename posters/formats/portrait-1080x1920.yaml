format: Portrait 1080x1920

canvas:
  width: 1080
  height: 1920
  image_offset_x: 0
  image_offset_y: 0

defaults:
  colour: '#FFFFFF'
  min_size: 40
  line_spacing: 8
  align: center
  valign: middle

layouts:

  Instagram Story Safe:

    elements:
      - title
      - type
      - datetime
      - dm
      - credits

    definitions:

      title:
        value: '{title}'
        font: fonts/Blue_Cashews.otf
        size: 260
        x: 80
        y: 260
        width: 920
        height: 420
      type:
        value: 'A {game_type} {system} {session_type}'
        font: fonts/Gilroy-Bold.ttf
        size: 75
        x: 80
        y: 1250
        width: 920
        height: 70
      datetime:
        value: '{poster_datetime}'
        font: fonts/Gilroy-Bold.ttf
        size: 65
        x: 80
        y: 1330
        width: 920
        height: 70
      dm:
        value: 'DM: {dm}'
        font: fonts/Gilroy-Bold.ttf
        size: 80
        colour: '#0DBCDA'
        x: 80
        y: 1420
        width: 920
        height: 70
      credits:
        value: 'Art: {art_credits}'
        font: fonts/Gilroy-Bold.ttf
        size: 24
        colour: '#BBBBBB'
        align: right
        valign: bottom
        x: 40
        y: 1780
        width: 1000
        height: 50

