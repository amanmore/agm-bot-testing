format: Landscape 1920x1080

canvas:
  width: 1920
  height: 1080
  image_offset_x: 0
  image_offset_y: 0

defaults:
  colour: "#FFFFFF"
  min_size: 40
  line_spacing: 8
  align: center
  valign: middle

layouts:

  Standard:

    elements:
      - title
      - type
      - datetime
      - dm
      - credits

    definitions:

      title:
        value: "{title}"
        font: fonts/Blue_Cashews.otf
        size: 340
        x: 140
        y: 80
        width: 1640
        height: 360

      type:
        value: "A {game_type} {system} {session_type}"
        font: fonts/Gilroy-Bold.ttf
        size: 110
        x: 140
        y: 720
        width: 1640
        height: 100

      datetime:
        value: "{poster_datetime}"
        font: fonts/Gilroy-Bold.ttf
        size: 90
        x: 140
        y: 830
        width: 1640
        height: 70

      dm:
        value: "DM: {dm}"
        font: fonts/Gilroy-Bold.ttf
        size: 120
        colour: "#0DBCDA"
        x: 140
        y: 910
        width: 1640
        height: 80

      credits:
        value: "Art: {art_credits}"
        font: fonts/Gilroy-Bold.ttf
        size: 32
        colour: "#BBBBBB"
        align: right
        valign: bottom
        x: 40
        y: 1010
        width: 1840
        height: 50

  Cinematic:

    elements:
      - title
      - datetime
      - dm
      - credits

    definitions:

      title:
        value: "{title}"
        font: fonts/Blue_Cashews.otf
        size: 520
        x: 180
        y: 120
        width: 1560
        height: 500

      datetime:
        value: "{poster_datetime}"
        font: fonts/Gilroy-Bold.ttf
        size: 80
        x: 140
        y: 820
        width: 1640
        height: 60

      dm:
        value: "DM: {dm}"
        font: fonts/Gilroy-Bold.ttf
        size: 95
        colour: "#0DBCDA"
        x: 140
        y: 900
        width: 1640
        height: 60

      credits:
        value: "Art: {art_credits}"
        font: fonts/Gilroy-Bold.ttf
        size: 30
        colour: "#BBBBBB"
        align: right
        valign: bottom
        x: 40
        y: 1010
        width: 1840
        height: 50

  Wide Cinematic:

    elements:
      - title
      - datetime
      - dm
      - credits

    definitions:

      title:
        value: "{title}"
        font: fonts/Blue_Cashews.otf
        size: 620
        x: 260
        y: 220
        width: 1400
        height: 360

      datetime:
        value: "{poster_datetime}"
        font: fonts/Gilroy-Bold.ttf
        size: 70
        x: 140
        y: 870
        width: 1640
        height: 50

      dm:
        value: "DM: {dm}"
        font: fonts/Gilroy-Bold.ttf
        size: 80
        colour: "#0DBCDA"
        x: 140
        y: 930
        width: 1640
        height: 50

      credits:
        value: "Art: {art_credits}"
        font: fonts/Gilroy-Bold.ttf
        size: 28
        colour: "#BBBBBB"
        align: right
        valign: bottom
        x: 40
        y: 1010
        width: 1840
        height: 50